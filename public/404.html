<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Muslim Luminaries - Page not found">
    <meta name="robots" content="noindex, follow">
    <title>Muslim Luminaries - Page Not Found</title>
    <script>
        // Vercel serves this for any unmatched route. Redirect to the app root.
        (function () {
            if (window.location.pathname !== '/') {
                window.location.replace('/' + window.location.search + window.location.hash)
            }
        })()
    </script>
</head>
<body>
    <main>
        <h1>Page Not Found</h1>
        <p>Redirecting to <a href="/">Muslim Luminaries</a>...</p>
    </main>
</body>
</html>
