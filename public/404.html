<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Muslim Luminaries - Page redirect">
    <title>Muslim Luminaries</title>
    <meta http-equiv="refresh" content="0; url=./">
    <script>
        // GitHub Pages serves this for any 404 under the project. Redirect to
        // the project root (the first path segment), which hosts the app.
        (function () {
            var l = window.location
            var base = '/' + l.pathname.split('/')[1] + '/'
            l.replace(base)
        })()
    </script>
</head>
<body>
    Redirecting to <a href="./">Muslim Luminaries</a>...
</body>
</html>
